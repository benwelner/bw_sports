name: Sports Data Sync
on:
  schedule:
    - cron: '*/30 * * * *' # This runs every 30 minutes!
  workflow_dispatch: # Allows you to run it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Node
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install Deps
        run: npm install
      - name: Run Scraper
        run: node src/scraper.js